# Fast feedback on pull requests: render to memory (no public/ artifact) and
# fail on anything the production build would also fail on, plus warnings
# that renderToMemory can surface but a normal build wouldn't fail without
# --panicOnWarning explicitly set here too.
name: PR check

on:
  pull_request:
    branches:
      - master

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Required by enableGitInfo: Hugo reads each page's last commit date.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Hugo resources
        uses: actions/cache@v6
        with:
          path: resources/_gen
          key: hugo-resources-${{ hashFiles('content/**', 'themes/marku/assets/**', 'pnpm-lock.yaml') }}
          restore-keys: |
            hugo-resources-

      - name: Check with Hugo
        run: |
          hugo --renderToMemory \
            --panicOnWarning \
            --printPathWarnings \
            --printI18nWarnings
