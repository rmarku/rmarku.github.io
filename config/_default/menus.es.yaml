# pageRef (rather than url) lets Hugo validate the target at build time and
# populate .IsMenuCurrent / .HasMenuCurrent for active-state styling.
main:
  - identifier: posts
    name: Blog
    pageRef: /articles
    weight: 1
  - identifier: about
    name: Sobre mi
    pageRef: /page/about
    weight: 2
  - identifier: resume
    name: CV
    pageRef: /resume
    weight: 3
  - identifier: uses
    name: Que uso
    pageRef: /page/uses
    weight: 4
