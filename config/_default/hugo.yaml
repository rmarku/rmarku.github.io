baseURL: 'https://www.marku.me/'
locale: 'es'
title: 'Marku blog'
copyright: '© 2019 Ricardo Martín Marcucci'
theme: 'marku'
enableEmoji: true

pagination:
  pagerSize: 5

enableGitInfo: true
taxonomies:
  category: 'categories'
  tag: 'tags'
  series: 'series'

outputs:
  home:
    - 'HTML'
    - 'RSS'
    - 'JSON'

defaultContentLanguage: 'es'
languages:
  en:
    label: 'English'
    locale: 'en'
    weight: 1
    params:
      languageFlag: '🇬🇧'
      languageNameShort: 'EN'

  es:
    label: 'Español'
    locale: 'es'
    weight: 2
    params:
      languageFlag: '🇪🇸'
      languageNameShort: 'ES'

params:
  author:
    name: 'Ricardo Martín Marcucci'
    email: 'rmarku@gmail.com'
  description: Between transistors and bytes
  images:
    - site-feature-image.jpg
  title: 'Marku blog'
  tags: true
