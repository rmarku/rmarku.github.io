baseURL: 'https://www.marku.me/'
title: 'Marku blog'
copyright: '© 2019 Ricardo Martín Marcucci'
theme: 'marku'

enableEmoji: true
enableGitInfo: true
enableRobotsTXT: true

defaultContentLanguage: 'es'

pagination:
  pagerSize: 8

taxonomies:
  category: 'categories'
  tag: 'tags'
  series: 'series'

outputs:
  home:
    - 'HTML'
    - 'RSS'
    - 'SearchIndex'

build:
  # Without these, editing CSS/JS under assets/ during `hugo server` only
  # rebuilds the resource, not the pages that fingerprint it.
  cachebusters:
    - source: 'assets/css/.*\.css'
      target: 'css'
    - source: 'assets/js/.*\.js'
      target: 'js'
