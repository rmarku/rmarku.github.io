{{ if or .NextInSection .PrevInSection -}}
<div id="nextprev">
    {{- with .PrevInSection }}
    <div id="prevart">
        {{ i18n "postsNewer" }}: <a href="{{ .RelPermalink}}">{{.Title}}</a>
    </div>
    {{ end -}} {{- with .NextInSection -}}
    <div id="nextart">
        {{ i18n "postsOlder" }}: <a href="{{ .RelPermalink}}">{{ .Title}}</a>
    </div>
    {{ end -}}
</div>
{{ end -}}
