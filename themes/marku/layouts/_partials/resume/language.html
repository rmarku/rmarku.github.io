{{ $data := index . "data" }}
{{ $lang := index . "lang" }}
<h2 id="language">{{ partial "icon.html" "languages" }} {{ i18n "languages"}}</h2>
<ul>
    {{ range $data.basics.languages}}
    <li>
        <span>{{ i18n .fluency }}</span>
        {{ partial "icon.html" "chevron-right" }} {{index .name $lang}}
    </li>
    {{end}}
</ul>
