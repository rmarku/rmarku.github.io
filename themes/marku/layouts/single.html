

{{ define "main" -}}
<article>
    <h1>{{ .Title }}</h1>
    <section>
        <i class="fa-solid fa-calendar"></i> <time datetime="{{ .PublishDate.Format `2006-01-02` }}">{{ i18n "publishDateFull" .
            }}</time><br />
        <i class="fa-solid fa-file-word"></i> {{ i18n "wordCount" . }}<br />
        <i class="fa-solid fa-book-open-reader"></i> {{ i18n "minuteRead" . }}<br />


    </section>
    {{ .Content }}
    {{ partial "comments.html" . }}
</article>
{{- end }}
